<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      font-family: sans-serif;
    }

    /* ========= 粉色标题栏 ========= */
    .titlebar {
      height: 80px;
      /* 标题栏高度 */
      background: rgb(253, 138, 161);
      /* 主题色 #FD8AA1 */
      display: flex;
      align-items: center;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    /* 标题栏左侧圆形小图标（截图里的白色聊天气泡图标，占位用） */
    .titlebar .logo {
      width: 50px;
      height: 50px;
      opacity: 0.9;
      margin-right: 16px;
      /* 图标与文字间距 */
      flex-shrink: 0;
    }

    .titlebar .title {
      font-size: 34px;
      font-weight: bold;
      color: #ffffff;
    }

    /* 关闭按钮（右侧 X）：占位方块，LVGL 里可换成符号/图片 */
    .titlebar .close {
      margin-left: auto;
      /* 推到最右边 */
      width: 44px;
      height: 44px;
      color: #ffffff;
      font-size: 40px;
      line-height: 40px;
      text-align: center;
    }

    /* ========= 聊天区 ========= */
    .chat {
      display: flex;
      flex-direction: column;
      gap: 56px;
      padding: 32px 0;
    }

    .msg {
      display: flex;
      align-items: flex-start;
      padding: 0 24px;
      max-width: 100%;
    }

    /* ---- 对方（左侧） ---- */
    .msg.other {
      flex-direction: row;
    }

    .msg.other .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #d9e6f2;
      flex-shrink: 0;
      margin-right: 24px;
    }

    .msg.other .content {
      display: flex;
      flex-direction: column;
    }

    .msg.other .name {
      font-size: 34px;
      font-weight: bold;
      color: #2b2b2b;
      margin-bottom: 12px;
    }

    .msg.other .bubble {
      background: rgb(76, 93, 113);
      color: #ffffff;
      font-size: 32px;
      line-height: 1.45;
      padding: 24px 28px;
      border-radius: 16px;
      max-width: 620px;
      position: relative;
    }

    .msg.other .bubble::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 24px;
      border: 12px solid transparent;
      border-right-color: rgb(76, 93, 113);
      border-left: 0;
    }

    /* ---- 我方（右侧） ---- */
    .msg.mine {
      flex-direction: row-reverse;
    }

    .msg.mine .bubble {
      background: rgb(75, 138, 203);
      color: #ffffff;
      font-size: 32px;
      line-height: 1.45;
      padding: 24px 28px;
      border-radius: 16px;
      max-width: 680px;
      position: relative;
    }

    .msg.mine .bubble::after {
      content: "";
      position: absolute;
      right: -12px;
      top: 24px;
      border: 12px solid transparent;
      border-left-color: rgb(75, 138, 203);
      border-right: 0;
    }
  </style>
</head>

<body>

  <!-- 标题栏 -->
  <div class="titlebar">
    <div class="logo">
      <img src="./MomoIcon.png" alt="MomoTalk" style="width: 100%; height: 100%; border-radius: 50%;">
    </div>
    <div class="title">MomoTalk</div>
    <div class="close"> 
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </div>
  </div>

  <div class="chat">

    <!-- 对方：测试文本 -->
    <div class="msg other">
      <div class="avatar"></div>
      <div class="content">
        <div class="name">百合园 圣娅</div>
        <div class="bubble">测试文本</div>
      </div>
    </div>

    <!-- 我方：文本测试 -->
    <div class="msg mine">
      <div class="bubble">文本测试</div>
    </div>

  </div>
</body>

</html>
