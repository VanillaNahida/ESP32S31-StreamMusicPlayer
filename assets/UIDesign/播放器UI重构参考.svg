  <g id="right-lyrics" text-anchor="start">
    <text x="336" y="118" fill="#FFFFFF" fill-opacity="0.28" font-size="16">But no more than I have done</text>
    <text x="336" y="156" fill="#FFFFFF" fill-opacity="0.45" font-size="17">I've lost count of it</text>
    
    <text x="336" y="202" fill="#FFFFFF" font-size="23" font-weight="700">Trying to laugh with my own</text>
    
    <text x="336" y="246" fill="#FFFFFF" fill-opacity="0.45" font-size="17">Sad and little broken heart</text>
    <text x="336" y="284" fill="#FFFFFF" fill-opacity="0.30" font-size="16">On the road</text>
    <text x="336" y="322" fill="#FFFFFF" fill-opacity="0.18" font-size="15">But then finally found I want</text>
