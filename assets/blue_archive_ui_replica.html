<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Archive UI Replica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:ital,wght@0,400;0,500;0,700;0,900;1,700;1,900&display=swap');

        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background-color: #121824;
            background-image: 
                radial-gradient(circle at 50% 40%, rgba(30, 64, 110, 0.6) 0%, rgba(10, 15, 26, 0.95) 100%),
                linear-gradient(45deg, rgba(0, 162, 255, 0.05) 25%, transparent 25%, transparent 75%, rgba(0, 162, 255, 0.05) 75%),
                linear-gradient(45deg, rgba(0, 162, 255, 0.05) 25%, transparent 25%, transparent 75%, rgba(0, 162, 255, 0.05) 75%);
            background-size: 100% 100%, 60px 60px, 60px 60px;
            background-position: 0 0, 0 0, 30px 30px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        @keyframes slideInUp {
            0% {
                transform: translateY(100vh) scale(0.95);
                opacity: 0;
            }
            70% {
                transform: translateY(-8px) scale(1.005);
                opacity: 1;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes slideOutDown {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) scale(0.92);
                opacity: 0;
            }
        }

        @keyframes toastAnimation {
            0% {
                opacity: 0;
                transform: translate(-50%, 30px) scale(0.95);
            }
            12% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1);
            }
            85% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -20px) scale(0.95);
            }
        }

        .anim-slide-in {
            animation: slideInUp 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .anim-slide-out {
            animation: slideOutDown 0.3s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        .anim-toast {
            animation: toastAnimation 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .ba-dialog {
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        }

        /* Blue Archive light geometry triangles in popups */
        .ba-dialog::before {
            content: '';
            position: absolute;
            top: -60px;
            left: -60px;
            width: 220px;
            height: 220px;
            background: linear-gradient(135deg, rgba(200, 235, 255, 0.6) 0%, rgba(200, 235, 255, 0) 65%);
            transform: rotate(35deg);
            pointer-events: none;
            z-index: 1;
        }

        .ba-dialog::after {
            content: '';
            position: absolute;
            bottom: -90px;
            right: -70px;
            width: 320px;
            height: 260px;
            background: linear-gradient(-45deg, rgba(185, 230, 255, 0.7) 0%, rgba(220, 243, 255, 0.2) 50%, transparent 70%);
            transform: rotate(-12deg);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 25% 100%);
            pointer-events: none;
            z-index: 1;
        }

        .ba-dialog-content {
            position: relative;
            z-index: 10;
        }

        .ba-title-underline {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 38px;
            height: 4px;
            background-color: #fcc800; /* Distinct BA Accent Yellow */
            border-radius: 2px;
        }

        .ba-btn-wrapper {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            outline: none;
        }

        .ba-skew-btn {
            transform: skewX(-14deg);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 170px;
            height: 52px;
            border: 2px solid transparent;
        }

        .ba-btn-wrapper:hover .ba-skew-btn {
            filter: brightness(1.06);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
        }

        .ba-btn-wrapper:active .ba-skew-btn {
            transform: skewX(-14deg) scale(0.96);
            filter: brightness(0.95);
        }

        .ba-skew-btn-text {
            transform: skewX(14deg); /* Counter-skew text */
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 1.5px;
        }

        /* Confirm Cyan Button */
        .ba-btn-confirm .ba-skew-btn {
            background: linear-gradient(135deg, #38c8ff 0%, #0096e6 100%);
            border-color: #7ce3ff;
        }
        .ba-btn-confirm .ba-skew-btn-text {
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 50, 100, 0.4);
        }

        /* Cancel Grey/Light Blue Button */
        .ba-btn-cancel .ba-skew-btn {
            background: linear-gradient(135deg, #eef5f9 0%, #d5e2eb 100%);
            border-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }
        .ba-btn-cancel .ba-skew-btn-text {
            color: #3b5166;
        }

        /* Key Indicator Badge (Enter / Esc) */
        .ba-btn-badge {
            background-color: #1a2a3e;
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 2px 9px;
            border-radius: 3px;
            margin-top: -8px;
            z-index: 15;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .ba-toast-box {
            position: fixed;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(40, 44, 52, 0.92);
            backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 14px 48px;
            border-radius: 9999px;
            font-size: 1.35rem;
            font-weight: 800;
            font-style: italic;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.1);
            z-index: 9999;
            pointer-events: none;
            display: none;
            letter-spacing: 1px;
        }

        .ba-sidebar-item {
            padding: 16px 24px;
            font-size: 1.15rem;
            font-weight: 800;
            color: #5d6f88;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            position: relative;
        }

        .ba-sidebar-item:hover {
            color: #0088cc;
            background-color: rgba(0, 136, 204, 0.04);
        }

        .ba-sidebar-item.active {
            background-color: #dcf2ff;
            color: #008fdb;
            font-weight: 900;
        }

        .ba-sidebar-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background-color: #008fdb;
        }

        .ba-section-title {
            font-size: 1.05rem;
            font-weight: 900;
            color: #334155;
            display: flex;
            align-items: center;
        }

        .ba-section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background-color: #0096e6;
            margin-right: 10px;
            border-radius: 2px;
        }

        /* Custom Radio Button styling */
        .ba-radio-label {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            margin-right: 36px;
            color: #475569;
            font-size: 1.05rem;
            font-weight: 700;
            transition: color 0.15s;
        }

        .ba-radio-label:hover {
            color: #0086d6;
        }

        .ba-radio-input {
            display: none;
        }

        .ba-radio-mark {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            margin-right: 10px;
            position: relative;
            background-color: #ffffff;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
        }

        .ba-radio-input:checked + .ba-radio-mark {
            border-color: #0096e6;
            background-color: #ffffff;
        }

        .ba-radio-input:checked + .ba-radio-mark::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background-color: #0096e6;
            border-radius: 50%;
        }

        .dotted-divider {
            border-bottom: 2px dotted #d1d5db;
            margin: 18px 0;
            width: 100%;
        }

        /* Custom Input Container */
        .ba-input-box {
            background-color: #f1f5f9;
            border-bottom: 2px solid #64748b;
            padding: 10px 16px;
            border-radius: 4px 4px 0 0;
            transition: border-color 0.2s;
        }

        .ba-input-box:focus-within {
            border-color: #0096e6;
            background-color: #eef6ff;
        }

        .ba-input-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #1e293b;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between relative">

    <header class="w-full p-4 flex flex-wrap gap-3 justify-center items-center z-30 bg-slate-900/40 backdrop-blur-md border-b border-white/10">
        <span class="text-sky-400 font-black text-lg mr-2 italic tracking-wider">BLUE ARCHIVE UI</span>
        <button onclick="triggerToast()" class="px-4 py-2 bg-slate-800/90 hover:bg-sky-600 text-white rounded-lg font-bold border border-sky-400/30 shadow-md transition-all active:scale-95">
            显示 Toast 提示
        </button>
        <button onclick="openModal('inputDialog')" class="px-4 py-2 bg-slate-800/90 hover:bg-sky-600 text-white rounded-lg font-bold border border-sky-400/30 shadow-md transition-all active:scale-95">
            输入弹窗 (通知)
        </button>
        <button onclick="openModal('confirmDialog')" class="px-4 py-2 bg-slate-800/90 hover:bg-sky-600 text-white rounded-lg font-bold border border-sky-400/30 shadow-md transition-all active:scale-95">
            确认弹窗 (通知)
        </button>
        <button onclick="openModal('settingsDialog')" class="px-4 py-2 bg-slate-800/90 hover:bg-sky-600 text-white rounded-lg font-bold border border-sky-400/30 shadow-md transition-all active:scale-95">
            选项列表 (设置)
        </button>
    </header>

    <div id="baToast" class="ba-toast-box">
        当前无法使用。
    </div>

    <div id="baOverlay" class="fixed inset-0 bg-slate-950/65 backdrop-blur-[2px] z-40 hidden flex items-center justify-center p-4">

        <!-- 1. Notification Input Dialog -->
        <div id="inputDialog" class="ba-dialog hidden w-[540px] max-w-full">
            <div class="ba-dialog-content p-6 flex flex-col">
                <!-- Header -->
                <div class="relative text-center mb-6 pt-2">
                    <h2 class="text-2xl font-black text-slate-800 relative inline-block">
                        通 知
                        <div class="ba-title-underline"></div>
                    </h2>
                    <button onclick="closeModal()" class="absolute right-0 top-0 text-slate-400 hover:text-slate-700 transition-colors p-1">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <!-- Body -->
                <div class="flex-1 flex flex-col items-center px-4 py-2">
                    <p class="text-slate-700 font-bold text-lg mb-6 tracking-wide">请输入问候语。</p>
                    
                    <div class="w-full ba-input-box flex items-center mb-2 shadow-inner">
                        <span class="text-slate-400 font-bold mr-3 text-base shrink-0">输入</span>
                        <input type="text" id="greetingInput" value="" placeholder="请输入内容..." />
                        <svg class="w-5 h-5 text-slate-400 ml-2 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                        </svg>
                    </div>
                    <p class="text-slate-400 text-xs font-medium self-center mt-1">※问候语最多可以输入40个字。</p>
                </div>

                <!-- Footer Buttons -->
                <div class="flex justify-center mt-8 mb-2">
                    <div class="ba-btn-wrapper ba-btn-confirm" onclick="closeModal()">
                        <div class="ba-skew-btn">
                            <span class="ba-skew-btn-text">确认</span>
                        </div>
                        <div class="ba-btn-badge">Enter</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. Confirmation Dialog -->
        <div id="confirmDialog" class="ba-dialog hidden w-[540px] max-w-full">
            <div class="ba-dialog-content p-6 flex flex-col">
                <!-- Header -->
                <div class="relative text-center mb-8 pt-2">
                    <h2 class="text-2xl font-black text-slate-800 relative inline-block">
                        通 知
                        <div class="ba-title-underline"></div>
                    </h2>
                    <button onclick="closeModal()" class="absolute right-0 top-0 text-slate-400 hover:text-slate-700 transition-colors p-1">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <!-- Body -->
                <div class="py-6 flex flex-col items-center justify-center">
                    <p class="text-slate-800 font-bold text-xl tracking-wider">是否结束游戏？</p>
                </div>

                <!-- Footer Buttons -->
                <div class="flex justify-center gap-8 mt-6 mb-2">
                    <div class="ba-btn-wrapper ba-btn-cancel" onclick="closeModal()">
                        <div class="ba-skew-btn">
                            <span class="ba-skew-btn-text">取消</span>
                        </div>
                        <div class="ba-btn-badge">Esc</div>
                    </div>
                    <div class="ba-btn-wrapper ba-btn-confirm" onclick="closeModal()">
                        <div class="ba-skew-btn">
                            <span class="ba-skew-btn-text">确认</span>
                        </div>
                        <div class="ba-btn-badge">Enter</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. Settings List Dialog -->
        <div id="settingsDialog" class="ba-dialog hidden w-[820px] max-w-full h-[520px]">
            <div class="ba-dialog-content flex flex-col h-full">
                <!-- Header -->
                <div class="relative text-center pt-5 pb-3">
                    <h2 class="text-2xl font-black text-slate-800 relative inline-block">
                        选 项
                        <div class="ba-title-underline"></div>
                    </h2>
                    <button onclick="closeModal()" class="absolute right-6 top-5 text-slate-400 hover:text-slate-700 transition-colors p-1">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <!-- Body with Sidebar and Content -->
                <div class="flex flex-1 overflow-hidden border-t-2 border-slate-100">
                    <!-- Left Sidebar Tab -->
                    <div class="w-1/4 bg-slate-50/80 border-r border-slate-200/60 flex flex-col pt-2">
                        <div class="ba-sidebar-item" onclick="selectTab(this)">图像</div>
                        <div class="ba-sidebar-item active" onclick="selectTab(this)">音量</div>
                    </div>

                    <!-- Right Options Content Panel -->
                    <div class="w-3/4 p-6 overflow-y-auto bg-white">
                        
                        <!-- Section: Display Mode -->
                        <div class="mb-3">
                            <div class="ba-section-title">画面模式</div>
                            <div class="flex ml-4 mt-3">
                                <label class="ba-radio-label">
                                    <input type="radio" name="displayMode" class="ba-radio-input" value="full">
                                    <span class="ba-radio-mark"></span>
                                    全屏幕
                                </label>
                                <label class="ba-radio-label">
                                    <input type="radio" name="displayMode" class="ba-radio-input" value="windowed" checked>
                                    <span class="ba-radio-mark"></span>
                                    窗口
                                </label>
                            </div>
                        </div>

                        <div class="dotted-divider"></div>

                        <!-- Section: Aspect Ratio -->
                        <div class="mb-3">
                            <div class="ba-section-title">画面比例</div>
                            <div class="flex ml-4 mt-3">
                                <label class="ba-radio-label">
                                    <input type="radio" name="aspectRatio" class="ba-radio-input" value="4:3">
                                    <span class="ba-radio-mark"></span>
                                    4:3
                                </label>
                                <label class="ba-radio-label">
                                    <input type="radio" name="aspectRatio" class="ba-radio-input" value="16:9" checked>
                                    <span class="ba-radio-mark"></span>
                                    16:9
                                </label>
                            </div>
                        </div>

                        <div class="dotted-divider"></div>

                        <!-- Section: FPS -->
                        <div class="mb-3">
                            <div class="ba-section-title">帧</div>
                            <div class="flex ml-4 mt-3">
                                <label class="ba-radio-label">
                                    <input type="radio" name="fps" class="ba-radio-input" value="60" checked>
                                    <span class="ba-radio-mark"></span>
                                    60
                                </label>
                                <label class="ba-radio-label">
                                    <input type="radio" name="fps" class="ba-radio-input" value="30">
                                    <span class="ba-radio-mark"></span>
                                    30
                                </label>
                            </div>
                        </div>

                        <div class="dotted-divider"></div>

                        <!-- Section: Black Borders -->
                        <div class="mb-2 pb-4">
                            <div class="ba-section-title">战斗画面上下黑边</div>
                            <div class="flex ml-4 mt-3">
                                <label class="ba-radio-label">
                                    <input type="radio" name="blackBar" class="ba-radio-input" value="on" checked>
                                    <span class="ba-radio-mark"></span>
                                    开启
                                </label>
                                <label class="ba-radio-label">
                                    <input type="radio" name="blackBar" class="ba-radio-input" value="off">
                                    <span class="ba-radio-mark"></span>
                                    关闭
                                </label>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const overlay = document.getElementById('baOverlay');
        const dialogIds = ['inputDialog', 'confirmDialog', 'settingsDialog'];
        let currentActiveDialog = null;
        let isAnimating = false;
        let toastTimer = null;

        function triggerToast() {
            const toast = document.getElementById('baToast');
            toast.style.display = 'block';
            toast.classList.remove('anim-toast');
            void toast.offsetWidth; // Force CSS reflow
            toast.classList.add('anim-toast');

            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.style.display = 'none';
            }, 2500);
        }

        function openModal(dialogId) {
            if (isAnimating) return;

            const targetDialog = document.getElementById(dialogId);
            if (!targetDialog) return;

            // Hide other dialogs
            dialogIds.forEach(id => {
                if (id !== dialogId) {
                    const el = document.getElementById(id);
                    el.classList.add('hidden');
                    el.classList.remove('anim-slide-in', 'anim-slide-out');
                }
            });

            // Show backdrop overlay
            overlay.classList.remove('hidden');

            // Animate target dialog in from bottom
            targetDialog.classList.remove('hidden', 'anim-slide-out');
            targetDialog.classList.add('anim-slide-in');
            currentActiveDialog = targetDialog;
        }

        function closeModal() {
            if (isAnimating || !currentActiveDialog) return;

            isAnimating = true;
            const target = currentActiveDialog;

            // Trigger slide out down animation
            target.classList.remove('anim-slide-in');
            target.classList.add('anim-slide-out');

            // Wait for exit animation to complete before hiding container
            setTimeout(() => {
                target.classList.add('hidden');
                target.classList.remove('anim-slide-out');
                
                // Hide overlay if no dialog active
                overlay.classList.add('hidden');
                currentActiveDialog = null;
                isAnimating = false;
            }, 280); // Duration matches cubic-bezier slideOutDown
        }

        function selectTab(element) {
            const items = document.querySelectorAll('.ba-sidebar-item');
            items.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }

        // Global Keyboard Shortcut Support (Esc / Enter)
        document.addEventListener('keydown', (e) => {
            if (!currentActiveDialog || isAnimating) return;

            if (e.key === 'Escape') {
                closeModal();
            } else if (e.key === 'Enter') {
                closeModal();
            }
        });

        // Overlay click to close
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                closeModal();
            }
        });
    </script>
</body>
</html>
