## ESP32-S31-Korvo-1 流媒体音乐播放器 —— 组件依赖
## 版本锁定：ESP-IDF 6.1 + LVGL 9.5 + esp_board_manager
dependencies:
  idf: ">=5.5"

  # ---- UI ----（锁 9.5 线，拼音输入法按 9.5 验证；勿升 9.6）
  lvgl/lvgl: "~9.5.0"

  # ---- 板级支持 ----
  # 官方 esp_board_manager 的 display_lvgl 示例用 esp_lvgl_adapter 做 LVGL 桥接
  # （原生支持 RGB tear-avoid 与旋转），本指南原写的 esp_lvgl_port 无此能力，
  # 按"官方优先"原则改用 esp_lvgl_adapter。
  espressif/esp_board_manager: "^0.7.3"
  espressif/esp_boards: "^0.6.1"
  espressif/esp_lvgl_adapter: "^0.7.2"
  espressif/esp_codec_dev: "^2.0.0-beta5"
  espressif/esp_lcd_touch: "^1.2.1"
  espressif/esp_lcd_touch_gt1151: "^1.1.1"
  espressif/led_strip: "^3.0.0"

  # ---- 网络 / JSON ----
  espressif/cjson: "^1.7.19"

  # ---- 封面解码 ----
  # JPEG 走 esp_new_jpeg；PNG 走官方 libpng 组件（自带上游 zlib）。
  # 有些专辑图 / 在线封面是 PNG（Meting 的 pic 接口不保证 jpg），
  # 只有 JPEG 解码器时这些歌就只能显示占位图。
  espressif/libpng: "^1.6.58"

  # ---- 音频管线 ----
  # 解码走 **libs/espaudiocore**（vendored 组件，根 CMakeLists 的 EXTRA_COMPONENT_DIRS
  # 注册），不再是 ESP-GMF 的 esp_audio_simple_player —— 后者的依赖（gmf_audio /
  # gmf_io / gmf_core）随 M2 迁移一并退出音频链路。
  #
  # esp_asrc：采样率/声道转换。espaudiocore 不做重采样，输出级用它把任意源
  # （44.1k/32k/24k/16k/8k…、单声道）统一到 48 kHz/16bit/2ch。
  # 之前它是被 esp_audio_simple_player 传递引入的，现在是**直接依赖**。
  espressif/esp_asrc: "^1.1.0"

  # ---- 蓝牙音频（A2DP Source：本机推流给耳机/音箱）----
  # ESP-GMF 的蓝牙音频模块：经典蓝牙 A2DP/AVRCP + LE Audio。
  # 它自己依赖 esp_audio_codec ~2.6 / gmf_core ~1.1 / gmf_io ~1.1，
  # 与本工程已装的 2.6.2 / 1.1.0 / 1.1.0 完全一致，不会顶版本。
  espressif/esp_bt_audio: "^1.1.0"

  # ---- 自研拼音输入法（开发期用 override_path，改代码免重新拉依赖） ----
  lvgl_pinyin_ime:
    override_path: "../../lvgl_pinyin_ime"